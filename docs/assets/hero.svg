<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Smart Krishi-Yatra animated banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04150e"/>
      <stop offset="55%" stop-color="#06281a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ef2a8"/>
      <stop offset="50%" stop-color="#39d98a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .fadeUp { opacity:0; animation: fu 1s ease forwards; }
      @keyframes fu { to { opacity:1; transform: translateY(0);} }
      .t1{animation-delay:.15s}.t2{animation-delay:.5s}.t3{animation-delay:.85s}
      .grid line { stroke:#134e33; stroke-width:1; opacity:.5 }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { 0%{transform:translateX(-260px)} 100%{transform:translateX(1240px)} }
      .truck { animation: drive 7s cubic-bezier(.4,0,.5,1) infinite; }
      @keyframes drive { 0%{transform:translate(0,0)} 100%{transform:translate(760px,-118px)} }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin .6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .pulse { animation: pl 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin:center }
      @keyframes pl { 0%,100%{ r:6; opacity:1 } 50%{ r:13; opacity:.25 } }
      .dash { stroke-dasharray: 10 12; animation: dashmove 1.6s linear infinite }
      @keyframes dashmove { to { stroke-dashoffset: -44 } }
      .cube { transform-box: fill-box; transform-origin: center; animation: tilt 8s ease-in-out infinite }
      @keyframes tilt { 0%,100%{transform:rotate(-6deg) translateY(0)} 50%{transform:rotate(6deg) translateY(-10px)} }
      text { font-family: "Segoe UI", Inter, system-ui, sans-serif }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <g class="grid">
    <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="0" y1="215" x2="1200" y2="215"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="120" y1="200" x2="20" y2="340"/><line x1="330" y1="200" x2="280" y2="340"/>
    <line x1="560" y1="200" x2="560" y2="340"/><line x1="800" y1="200" x2="850" y2="340"/>
    <line x1="1030" y1="200" x2="1130" y2="340"/>
  </g>
  <rect class="scan" x="0" y="0" width="180" height="340" fill="#39d98a" opacity="0.05"/>

  <!-- route -->
  <path d="M110 250 C 340 250, 520 190, 700 160 S 960 130, 1090 132" fill="none" stroke="#39d98a" stroke-width="3" opacity=".35"/>
  <path class="dash" d="M110 250 C 340 250, 520 190, 700 160 S 960 130, 1090 132" fill="none" stroke="#7ef2a8" stroke-width="3"/>
  <circle cx="110" cy="250" r="6" fill="#7ef2a8" class="pulse"/>
  <circle cx="1090" cy="132" r="6" fill="#38bdf8" class="pulse"/>
  <text x="72" y="285" fill="#8ad3ae" font-size="13">FARM · Shirur</text>
  <text x="1010" y="112" fill="#8fd6f5" font-size="13">MANDI · Pune APMC</text>

  <!-- truck -->
  <g class="truck">
    <g transform="translate(96,214)">
      <rect x="0" y="0" width="52" height="26" rx="4" fill="#123c2a" stroke="#39d98a"/>
      <rect x="52" y="8" width="22" height="18" rx="3" fill="#0f2f45" stroke="#38bdf8"/>
      <circle class="wheel" cx="14" cy="29" r="5" fill="#8ad3ae"/>
      <circle class="wheel" cx="40" cy="29" r="5" fill="#8ad3ae"/>
      <circle class="wheel" cx="64" cy="29" r="5" fill="#8fd6f5"/>
      <text x="4" y="17" fill="#7ef2a8" font-size="11">12 t</text>
    </g>
  </g>

  <!-- 3D cube -->
  <g class="cube" transform="translate(1040,232)" filter="url(#glow)">
    <polygon points="0,-26 34,-8 0,10 -34,-8" fill="#39d98a" opacity=".9"/>
    <polygon points="-34,-8 0,10 0,48 -34,30" fill="#0f6b46"/>
    <polygon points="34,-8 0,10 0,48 34,30" fill="#0b8f9c"/>
  </g>

  <g class="fadeUp t1" transform="translate(70,86)">
    <text font-size="48" font-weight="700" fill="url(#leaf)">Smart Krishi-Yatra</text>
  </g>
  <g class="fadeUp t2" transform="translate(72,124)">
    <text font-size="19" fill="#a7e8c6">Market-aware agri-logistics OS · Farmer · Driver · Fleet · Buyer · Admin</text>
  </g>
  <g class="fadeUp t3" transform="translate(72,158)">
    <text font-size="15" fill="#6fb894">ENR pricing · 12 t capacity engine · load pooling · live GPS · Sarvam AI in EN/HI/MR</text>
  </g>
</svg>
