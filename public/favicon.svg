<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281a"/>
      <stop offset="100%" stop-color="#021a10"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#10b981" stroke-width="3"/>

  <!-- Glowing Agri-Logistics Emblem -->
  <g filter="url(#glow)">
    <!-- Sprout / Grain stalk -->
    <path d="M64 96 C64 68 64 42 64 26" stroke="url(#leafGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M64 62 C42 60 30 46 32 30 C48 30 60 44 64 62 Z" fill="url(#leafGrad)"/>
    
    <!-- Right Golden Grain -->
    <path d="M64 46 C84 44 94 32 92 18 C78 18 68 30 64 46 Z" fill="url(#goldGrad)"/>

    <!-- Logistics Speed / Transit Arc -->
    <path d="M28 88 Q64 112 100 88" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 8"/>
    
    <!-- Pulse Nodes -->
    <circle cx="28" cy="88" r="5" fill="#38bdf8"/>
    <circle cx="100" cy="88" r="5" fill="#34d399"/>
  </g>
</svg>
